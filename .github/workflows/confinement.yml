# Runs the router's full Go suite, then the TestConfinement_* suite as root.
#
# The confinement tests are the only executable proof of the per-tenant OS
# boundary (uid separation, mount namespaces, the read-only package store, the
# per-org socket dirs). They are //go:build linux and skip without root, so on
# a macOS dev box the boundary is asserted by construction only — this job is
# where it actually runs. GitHub's ubuntu runners are full VMs (not
# containers), so passwordless sudo grants real CAP_SYS_ADMIN and the
# namespace/uid work all functions.
#
# WORKSPACE SHAPE. The router's go.mod resolves core and the vendored fork from
# the `tinycld` sibling (../tinycld/...), and the real-binary tests
# (BuildTenantBinary) build the app shell's DUAL-MODE tenant binary from
# ../tinycld/server — the real production tenant binary. That build needs the
# app shell's GENERATED Go wiring (server/go.work + server/package_extensions*.
# go), which the workspace generator emits during `pnpm install`; go.work is
# what links the feature members' server modules (../../<feature>/server), so
# feature Go now reaches a tenant through that binary, not a router-side menu.
#
# So this job assembles a real developer-shaped workspace under ws/ via
# @tinycld/bootstrap (the router checked out at ws/multi-org beside ws/tinycld,
# every feature cloned by --with), runs pnpm install to generate the app
# shell's server wiring, and only then builds and tests the Go. If the sibling
# repos are private, add a repo-scoped PAT as the SIBLING_CHECKOUT_TOKEN secret;
# with public repos the default token suffices.
name: confinement

on:
  push:
    branches: [multi-org, main]
  pull_request:
  workflow_dispatch:

jobs:
  confinement:
    runs-on: ubuntu-latest
    steps:
      # The router is the triggering checkout — land it at ws/multi-org so its
      # ../tinycld/... go.mod replaces and BuildTenantBinary's ../tinycld/server
      # lookup resolve against the assembled workspace.
      - uses: actions/checkout@v5
        with:
          path: ws/multi-org

      # tinycld carries its own .node-version; bootstrap has not written ws/
      # yet, so read it from a shallow standalone checkout of the shell.
      # Clone the default branch rather than pinning a ref: the shell's
      # multi-org branch merged into main and was deleted, and a hardcoded
      # branch name silently rots into a "Remote branch not found" the moment
      # that happens again.
      - name: Check out tinycld for .node-version
        env:
          GH_TOKEN: ${{ secrets.SIBLING_CHECKOUT_TOKEN || github.token }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/tinycld/tinycld.git" .node-version-src
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version-src/.node-version

      # Assemble app + core + every feature. bootstrap clones tinycld and each
      # --with feature as siblings under ws/, matching the router's relative
      # replaces and the app shell's go.work (../../<feature>/server).
      - name: Assemble workspace (app + core + features)
        working-directory: ws
        env:
          TINYCLD_REPO_BASE: ${{ secrets.SIBLING_CHECKOUT_TOKEN && format('https://x-access-token:{0}@github.com/tinycld', secrets.SIBLING_CHECKOUT_TOKEN) || 'https://github.com/tinycld' }}
        run: |
          npx @tinycld/bootstrap@latest --assemble-only \
            --with calc --with calendar --with contacts \
            --with drive --with mail --with text

      # Go toolchain after assembly: .go-version is bootstrap-generated into ws/.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
          cache-dependency-path: ws/multi-org/go.sum

      # Generate the app shell's server wiring (go.work + package_extensions*.go)
      # that BuildTenantBinary compiles. postinstall runs the generator.
      - name: Install (workspace root)
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile

      - name: Build and vet
        working-directory: ws/multi-org
        run: |
          go build ./...
          go vet ./...

      - name: Unit and integration tests
        working-directory: ws/multi-org
        run: go test ./... -count=1

      - name: Confinement tests (root)
        working-directory: ws/multi-org
        # Root gets its own build cache; sharing the runner user's would leave
        # root-owned files behind and break the post-job cache save. The module
        # cache is shared read-only — the steps above already downloaded
        # everything.
        run: |
          sudo env "PATH=$PATH" \
            "GOMODCACHE=$(go env GOMODCACHE)" "GOFLAGS=-mod=mod" \
            go test ./internal/orgmanager/ ./internal/builder/ -run TestConfinement -v -count=1

  # Browser-level acceptance against REAL provisioned orgs: two orgs, two tenant
  # processes, two databases, fronted by the real front router — then Playwright
  # driving the app shell's switcher across those two subdomains.
  #
  # Separate job rather than a step in `confinement`: it needs the Playwright
  # browser and the app shell's web bundle, neither of which the Go suite wants,
  # and a failure here should read as "the app is broken across orgs" rather than
  # as a confinement regression.
  browser-e2e:
    name: Browser E2E (two orgs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ws/multi-org

      - name: Check out tinycld for .node-version
        env:
          GH_TOKEN: ${{ secrets.SIBLING_CHECKOUT_TOKEN || github.token }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/tinycld/tinycld.git" .node-version-src
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version-src/.node-version

      # The tenant artifact is built from the sibling checkouts by the local npm
      # registry the test stands up, so the workspace must be assembled before
      # the build runs.
      #
      # Assembled with NO features, unlike the confinement job. The scaffold
      # copied into every build includes tinycld.packages.ts, which enumerates
      # whatever members are present — so assembling six features while building
      # a base-only lockfile makes postinstall fail with "no workspace member
      # named @tinycld/calc". The assembled set and the built set have to agree,
      # and the switcher UI under test is core, so base-only is both correct and
      # the cheaper half of that agreement.
      - name: Assemble workspace (app + core)
        working-directory: ws
        env:
          TINYCLD_REPO_BASE: ${{ secrets.SIBLING_CHECKOUT_TOKEN && format('https://x-access-token:{0}@github.com/tinycld', secrets.SIBLING_CHECKOUT_TOKEN) || 'https://github.com/tinycld' }}
        run: |
          npx @tinycld/bootstrap@latest --assemble-only

      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
          cache-dependency-path: ws/multi-org/go.sum

      # The builder copies a fixed set of workspace-root "scaffold extras" into
      # every build (pkgbuild.scaffoldExtras: .npmrc, tinycld.packages.ts,
      # scripts, tests, package-versions.json). bootstrap writes the middle
      # three; .npmrc and package-versions.json live in the separate
      # tinycld/workspace repo, so an assembled ws/ lacks them.
      #
      # package-versions.json is the one that fails loudly — ReadOverrides needs
      # it as a recipe-hash input, so the artifact build dies at resolve time.
      # A missing .npmrc is skipped silently, which is worse: the build would
      # quietly resolve against the wrong registry config. Copy both.
      #
      # The confinement job never builds an artifact, which is why only this job
      # needs them.
      - name: Fetch workspace-root scaffold extras
        env:
          GH_TOKEN: ${{ secrets.SIBLING_CHECKOUT_TOKEN || github.token }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/tinycld/workspace.git" ws-scaffold
          cp ws-scaffold/package-versions.json ws/package-versions.json
          cp ws-scaffold/.npmrc ws/.npmrc

      - name: Install (workspace root)
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile

      # Playwright browser + the static web bundle. The tenant artifact serves
      # its OWN copy of the bundle (it is built into the artifact), so this
      # installs the browser; the bundle build is what the artifact's own build
      # step consumes.
      - name: Configure test env
        uses: ./ws/tinycld/.github/actions/configure-test-env

      # A warm pnpm store makes the artifact build minutes rather than tens of
      # minutes — the builder resolves the org's package set through it.
      - name: Browser E2E (two provisioned orgs)
        working-directory: ws/multi-org
        env:
          RUN_HOSTED_BROWSER_E2E: '1'
          TINYCLD_WS_ROOT: ${{ github.workspace }}/ws
        run: |
          export BUILDER_E2E_PNPM_STORE="$(pnpm store path)"
          go test ./internal/controlplane/ -run TestHostedBrowserE2E -v -count=1 -timeout 60m

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: multi-org-playwright-artifacts
          path: |
            ws/tinycld/test-results/
            ws/tinycld/playwright-report/
          retention-days: 14
